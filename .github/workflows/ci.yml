name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    # The native client is built and tested on every operating system it
    # ships for. Each runner also builds every release archive and runs the
    # one that matches its own system.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: make release VERSION=0.0.0-ci

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file deploy/render/Dockerfile --tag tokenholic-api:ci .

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_DB: tokenholic_test
          POSTGRES_PASSWORD: tokenholic_test
          POSTGRES_USER: tokenholic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenholic -d tokenholic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TOKENHOLIC_TEST_DATABASE_URL: postgres://tokenholic:tokenholic_test@localhost:5432/tokenholic_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-postgres
