name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build deterministic release archives
        run: make release VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: tokenholic-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  # Archives are cross-compiled on macOS, so the build can run only its own.
  # Each other system runs its archive here before anything is published.
  # Windows arm64 has no runner here and is covered by the manual run in
  # docs/release-validation.md.
  smoke:
    needs: artifacts
    permissions: {}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: linux_x64
          - os: ubuntu-24.04-arm
            archive: linux_arm64
          - os: windows-latest
            archive: windows_x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tokenholic-${{ github.ref_name }}
          path: dist/
      - name: Verify the checksum and run the native binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="tokenholic_${version}_${{ matrix.archive }}.tar.gz"
          (cd dist && grep "  ${archive}\$" SHA256SUMS | sha256sum --check --strict)
          mkdir run && tar -xzf "dist/${archive}" -C run
          # Git Bash runs tokenholic.exe under this name too.
          test "$(./run/tokenholic --version)" = "${version}"

  release:
    needs: [artifacts, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tokenholic-${{ github.ref_name }}
          path: dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  npm:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: tokenholic-${{ github.ref_name }}
          path: dist/
      - name: Prepare and test npm packages
        run: |
          node scripts/prepare-npm-release.mjs "${GITHUB_REF_NAME#v}" dist .
          pnpm check
          pnpm test
      - name: Publish native packages before the umbrella
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm-release.mjs .
