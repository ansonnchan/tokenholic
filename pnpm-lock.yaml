lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/cli:
    optionalDependencies:
      '@tokenholic/darwin-arm64':
        specifier: workspace:*
        version: link:../darwin-arm64
      '@tokenholic/darwin-x64':
        specifier: workspace:*
        version: link:../darwin-x64
      '@tokenholic/linux-arm64':
        specifier: workspace:*
        version: link:../linux-arm64
      '@tokenholic/linux-x64':
        specifier: workspace:*
        version: link:../linux-x64
      '@tokenholic/win32-arm64':
        specifier: workspace:*
        version: link:../win32-arm64
      '@tokenholic/win32-x64':
        specifier: workspace:*
        version: link:../win32-x64

  packages/darwin-arm64: {}

  packages/darwin-x64: {}

  packages/linux-arm64: {}

  packages/linux-x64: {}

  packages/win32-arm64: {}

  packages/win32-x64: {}
